<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live AI Agent Virtual Office — Humas BPS Provinsi Lampung</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b1120;
      color: #f8fafc;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Animasi Karakter & Kantor Virtual */
    @keyframes typingBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    @keyframes screenPulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @keyframes floatBubble {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -24; }
    }

    .agent-working .avatar-body {
      animation: typingBob 0.45s infinite ease-in-out;
    }
    .agent-working .monitor-glow {
      animation: screenPulse 1s infinite ease-in-out;
    }
    .status-bubble {
      animation: floatBubble 3s infinite ease-in-out;
      transition: all 0.3s ease;
    }
    .flow-line-active {
      stroke-dasharray: 6 6;
      animation: dashFlow 0.8s linear infinite;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
  </style>
</head>
